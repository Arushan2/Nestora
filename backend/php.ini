; Nestora local dev PHP settings — use with: php -d upload_max_filesize=20M -d post_max_size=25M -d max_execution_time=60 -S 127.0.0.1:8000 backend/router.php
; Or edit the system php.ini directly and use the standard server start command.

upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 60
memory_limit = 256M
file_uploads = On
